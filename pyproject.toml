[project]
name = "vlm-mcp"
version = "0.1.0"
description = "VLM-based image understanding MCP Server with local llama.cpp and online Qwen3-VL support"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "openai>=1.0",
    "Pillow>=10.0",
    "requests>=2.28",
    "uvicorn>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
exclude = ["llama", "llama.*", "tests", "tests.*"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"