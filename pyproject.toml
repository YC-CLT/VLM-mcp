[project]
name = "vlm-mcp"
version = "0.1.0"
description = "VLM-based image understanding MCP Server with local llama.cpp and online VLM support"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "YC-CLT" },
]
keywords = ["vlm", "mcp", "llama.cpp", "vision-language-model", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "openai>=1.0",
    "Pillow>=10.0",
    "requests>=2.28",
    "uvicorn>=0.24",
    "rapidocr-onnxruntime>=1.3.0",
]

[project.urls]
Repository = "https://github.com/YC-CLT/VLM-mcp"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
exclude = ["llama", "llama.*", "tests", "tests.*"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"